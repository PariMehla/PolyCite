# Model config for PolyCite v1 (trial-key scope). Pin exact version strings
# once you've confirmed them on your Cohere dashboard — "latest" aliases drift.
retrieval:
  bm25: {enabled: true}
  dense_local:
    enabled: false  # needs `pip install sentence-transformers` + HF model download
    model: intfloat/multilingual-e5-small
  dense_cohere:
    enabled: true
    model: embed-multilingual-v3.0  # embed-v4.0 is NOT on this trial account's model list (checked via client.models.list())

rerank:
  model: rerank-v3.5  # UNVERIFIED: client.models.list() doesn't return rerank models at all, so this hasn't been confirmed against the live account. If a rerank call 404s, check your dashboard for the exact rerank model name and update this.
  top_k_in: 50
  top_k_out: 5

generation:
  model: command-a-03-2025  # confirmed present via client.models.list() on 2026-09-21
  temperature: 0.0
  max_tokens: 400

budget:
  cohere_call_cap: 1000
  generation_questions_per_language: 50  # v1 trial-key scope; plan calls for 300/lang in v2

cache_dir: cache
results_dir: results
figures_dir: figures
